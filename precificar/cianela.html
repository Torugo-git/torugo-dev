<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cianela Doceria | Precificação Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Verifica licença personalizada (se for um cliente comercial mostra o nome da loja dele; se for sua mãe mostra Cianela.)
        (function initLicenseBranding() {
            const licensedStore = localStorage.getItem('precificapro_licensed_store');
            if (licensedStore && licensedStore.toLowerCase() !== 'cianela') {
                document.title = licensedStore + ' | PrecificaPro';
                const bi = document.getElementById('brand-initial');
                const bt = document.getElementById('brand-title');
                const lb = document.getElementById('license-badge');
                if (bi) bi.textContent = licensedStore.charAt(0).toUpperCase();
                if (bt) bt.innerHTML = licensedStore + '<span class="text-primary">.</span>';
                if (lb) lb.textContent = '🔒 Licenciado: ' + licensedStore;
            }
        })();

        const initialIngredients = [
            { id: "1", name: "Leite Moça Integral Lata", size: 395, price: 7.28, costPerGram: 7.28/395 },
            { id: "2", name: "Leite Ninho Integral Pó", size: 400, price: 17.50, costPerGram: 17.50/400 },
            { id: "3", name: "Nutella Balde", size: 3000, price: 200.00, costPerGram: 200/3000 },
            { id: "4", name: "Leite Integral", size: 1000, price: 5.50, costPerGram: 5.50/1000 }
        ];

        const initialPackagings = [
            { id: "p1", name: "Saco Kraft P", size: 50, price: 15.00, costPerUnit: 15.00/50 },
            { id: "p2", name: "Adesivo Logo", size: 100, price: 20.00, costPerUnit: 20.00/100 }
        ];

        let ingredients = JSON.parse(localStorage.getItem('cianela_db_ingredients')) || initialIngredients;
        let packagings = JSON.parse(localStorage.getItem('cianela_db_packagings_lib')) || initialPackagings;
        
        let recipe = JSON.parse(localStorage.getItem('cianela_db_current_recipe')) || [];
        let syrupRecipe = JSON.parse(localStorage.getItem('cianela_db_current_syrup')) || [];
        let recipePacks = JSON.parse(localStorage.getItem('cianela_db_current_recipe_packs')) || [];
        let favoriteRecipes = JSON.parse(localStorage.getItem('cianela_db_favorites')) || [];

        const selectRecipeIngredient = document.getElementById('recipe-ingredient');
        const selectSyrupIngredient = document.getElementById('syrup-ingredient');
        const selectRecipePackaging = document.getElementById('recipe-packaging-select');
        
        const recipeItemsContainer = document.getElementById('recipe-items-container');
        const syrupItemsContainer = document.getElementById('syrup-items-container');
        const recipePacksContainer = document.getElementById('recipe-packs-container');
        
        const ingredientsGridContainer = document.getElementById('ingredients-grid-container');
        const packagingsGridContainer = document.getElementById('packagings-grid-container');
        const favoritesGridContainer = document.getElementById('favorites-grid-container');
        
        const inputRecipeName = document.getElementById('recipe-name');
        const inputYield = document.getElementById('var-yield');
        const inputYieldUnit = document.getElementById('var-yield-unit');
        const inputTime = document.getElementById('var-time');
        
        const inputSyrupBatchYield = document.getElementById('syrup-batch-yield');
        const inputSyrupUsedVolume = document.getElementById('syrup-used-volume');
        const lblSyrupCostPerMl = document.getElementById('lbl-syrup-cost-per-ml');
        const lblSyrupFinalCost = document.getElementById('lbl-syrup-final-cost');

        const inputPackaging = document.getElementById('var-packaging');
        const inputInvisible = document.getElementById('var-invisible');
        const inputLaborRate = document.getElementById('labor-rate');
        const inputLaborTime = document.getElementById('labor-time');
        const inputCardFeeRate = document.getElementById('card-fee-rate');
        const inputCmv = document.getElementById('var-cmv');

        const lblSubtotalIng = document.getElementById('lbl-subtotal-ingredients');
        const lblSubtotalSyrup = document.getElementById('lbl-subtotal-syrup');
        const lblTotalPackaging = document.getElementById('lbl-total-packaging');
        const lblVarCost = document.getElementById('lbl-variables-cost');
        const lblLaborCost = document.getElementById('lbl-labor-cost');
        
        const resTotalCost = document.getElementById('res-total-cost');
        const resUnitCost = document.getElementById('res-unit-cost');
        const resCostBreakdown = document.getElementById('res-cost-breakdown');
        const resUnitSalePrice = document.getElementById('res-unit-sale-price');
        const resTotalRevenue = document.getElementById('res-total-revenue');
        const resCardSalePrice = document.getElementById('res-card-sale-price');
        const resTotalProfit = document.getElementById('res-total-profit');
        const resUnitProfit = document.getElementById('res-unit-profit');
        const resLaborEarning = document.getElementById('res-labor-earning');
        const resLaborUnit = document.getElementById('res-labor-unit');
        const resPocketTotal = document.getElementById('res-pocket-total');
        const resPocketUnit = document.getElementById('res-pocket-unit');
        
        const kpiTotalIngredients = document.getElementById('kpi-total-ingredients');
        const kpiTotalPackagings = document.getElementById('kpi-total-packagings');

        const formatBRL = (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatPreciseUnitCost = (v) => {
            const val = v || 0;
            if (val > 0 && val < 0.05) {
                return 'R$ ' + val.toFixed(4).replace('.', ',');
            }
            return formatBRL(val);
        };

        // Inicialização de valores salvos
        inputRecipeName.value = localStorage.getItem('cianela_db_current_name') || "Nova Receita";
        inputYield.value = localStorage.getItem('cianela_db_yield') || 1;
        inputYieldUnit.value = localStorage.getItem('cianela_db_yieldUnit') || "unid.";
        inputTime.value = localStorage.getItem('cianela_db_time') || "1h";
        
        inputSyrupBatchYield.value = localStorage.getItem('cianela_db_syrup_yield') || 1;
        inputSyrupUsedVolume.value = localStorage.getItem('cianela_db_syrup_used') || 1;

        inputPackaging.value = localStorage.getItem('cianela_db_packaging') || "0.00"; 
        inputInvisible.value = localStorage.getItem('cianela_db_invisible') || 15;
        inputLaborRate.value = localStorage.getItem('cianela_db_laborRate') || "15.00";
        inputLaborTime.value = localStorage.getItem('cianela_db_laborTime') || 1;
        if (inputCardFeeRate) inputCardFeeRate.value = localStorage.getItem('cianela_db_cardFee') || 0;
        inputCmv.value = localStorage.getItem('cianela_db_cmv') || 35;

        window.switchTab = function(tabName) {
            ['precificador', 'estoque', 'embalagens', 'cardapio'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('active-tab');
                const btnMobile = document.getElementById(`btn-${t}-mobile`);
                if(btnMobile) btnMobile.classList.remove('active-tab');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`btn-${tabName}`).classList.add('active-tab');
            const activeMobile = document.getElementById(`btn-${tabName}-mobile`);
            if(activeMobile) activeMobile.classList.add('active-tab');
        };

        // Propaga atualização de ingrediente/embalagem para a receita atual e TODAS as Receitas Favoritas!
        function syncUpdatedLibrariesAcrossRecipes() {
            const ingMap = {};
            ingredients.forEach(i => ingMap[i.id] = i);
            const packMap = {};
            packagings.forEach(p => packMap[p.id] = p);

            recipe.forEach(item => { if (item.ingredient && ingMap[item.ingredient.id]) item.ingredient = ingMap[item.ingredient.id]; });
            syrupRecipe.forEach(item => { if (item.ingredient && ingMap[item.ingredient.id]) item.ingredient = ingMap[item.ingredient.id]; });
            recipePacks.forEach(item => { if (item.pack && packMap[item.pack.id]) item.pack = packMap[item.pack.id]; });

            favoriteRecipes.forEach(fav => {
                if (Array.isArray(fav.recipeData)) {
                    fav.recipeData.forEach(item => { if (item.ingredient && ingMap[item.ingredient.id]) item.ingredient = ingMap[item.ingredient.id]; });
                }
                if (Array.isArray(fav.syrupData)) {
                    fav.syrupData.forEach(item => { if (item.ingredient && ingMap[item.ingredient.id]) item.ingredient = ingMap[item.ingredient.id]; });
                }
                if (Array.isArray(fav.recipePacksData)) {
                    fav.recipePacksData.forEach(item => { if (item.pack && packMap[item.pack.id]) item.pack = packMap[item.pack.id]; });
                }
            });
        }

        // GESTÃO DA BIBLIOTECA DE INGREDIENTES (ADICIONAR E EDITAR)
        document.getElementById('form-ingredient').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('ing-edit-id').value;
            const name = document.getElementById('ing-name').value.trim();
            const size = parseFloat(document.getElementById('ing-size').value);
            const price = parseFloat(document.getElementById('ing-price').value);
            if (editId) {
                const idx = ingredients.findIndex(i => i.id === editId);
                if (idx >= 0) {
                    ingredients[idx] = { id: editId, name, size, price, costPerGram: price / size };
                }
                document.getElementById('ing-edit-id').value = '';
            } else {
                ingredients.push({ id: Date.now().toString(), name, size, price, costPerGram: price / size });
            }
            syncUpdatedLibrariesAcrossRecipes();
            saveState(); renderAll(); this.reset(); document.getElementById('ing-name').focus();
        });

        window.editIngredient = function(id) {
            const ing = ingredients.find(i => i.id === id);
            if (!ing) return;
            document.getElementById('ing-edit-id').value = ing.id;
            document.getElementById('ing-name').value = ing.name;
            document.getElementById('ing-size').value = ing.size;
            document.getElementById('ing-price').value = ing.price;
            document.getElementById('ing-price').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteIngredient = function(id) {
            if (!confirm('Deseja realmente excluir este ingrediente da biblioteca?')) return;
            ingredients = ingredients.filter(i => i.id !== id);
            recipe = recipe.filter(item => item.ingredient.id !== id);
            syrupRecipe = syrupRecipe.filter(item => item.ingredient.id !== id);
            saveState(); renderAll();
        };

        // GESTÃO DA BIBLIOTECA DE EMBALAGENS (ADICIONAR E EDITAR)
        document.getElementById('form-packaging-lib').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('pack-edit-id').value;
            const name = document.getElementById('pack-lib-name').value.trim();
            const size = parseInt(document.getElementById('pack-lib-size').value);
            const price = parseFloat(document.getElementById('pack-lib-price').value);
            if (editId) {
                const idx = packagings.findIndex(p => p.id === editId);
                if (idx >= 0) {
                    packagings[idx] = { id: editId, name, size, price, costPerUnit: price / size };
                }
                document.getElementById('pack-edit-id').value = '';
            } else {
                packagings.push({ id: Date.now().toString(), name, size, price, costPerUnit: price / size });
            }
            syncUpdatedLibrariesAcrossRecipes();
            saveState(); renderAll(); this.reset(); document.getElementById('pack-lib-name').focus();
        });

        window.editPackaging = function(id) {
            const pack = packagings.find(p => p.id === id);
            if (!pack) return;
            document.getElementById('pack-edit-id').value = pack.id;
            document.getElementById('pack-lib-name').value = pack.name;
            document.getElementById('pack-lib-size').value = pack.size;
            document.getElementById('pack-lib-price').value = pack.price;
            document.getElementById('pack-lib-price').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deletePackaging = function(id) {
            if (!confirm('Deseja realmente excluir esta embalagem da biblioteca?')) return;
            packagings = packagings.filter(p => p.id !== id);
            recipePacks = recipePacks.filter(item => item.pack.id !== id);
            saveState(); renderAll();
        };

        // MÓDULO 1: ADICIONAR MASSA
        document.getElementById('form-recipe').addEventListener('submit', function(e) {
            e.preventDefault();
            const ingId = selectRecipeIngredient.value;
            const qtd = parseFloat(document.getElementById('recipe-qtd').value);
            if(!ingId) return;
            const targetIng = ingredients.find(i => i.id === ingId);
            const existing = recipe.find(item => item.ingredient.id === ingId);
            if(existing) existing.qtd += qtd; else recipe.push({ ingredient: targetIng, qtd });
            saveState(); renderRecipeList(); calculateMaster(); document.getElementById('recipe-qtd').value = '';
        });
        window.removeRecipeItem = function(index) { recipe.splice(index, 1); saveState(); renderRecipeList(); calculateMaster(); };

        // MÓDULO 2: ADICIONAR CALDA
        document.getElementById('form-syrup').addEventListener('submit', function(e) {
            e.preventDefault();
            const ingId = selectSyrupIngredient.value;
            const qtd = parseFloat(document.getElementById('syrup-qtd').value);
            if(!ingId) return;
            const targetIng = ingredients.find(i => i.id === ingId);
            const existing = syrupRecipe.find(item => item.ingredient.id === ingId);
            if(existing) existing.qtd += qtd; else syrupRecipe.push({ ingredient: targetIng, qtd });
            saveState(); renderSyrupList(); calculateMaster(); document.getElementById('syrup-qtd').value = '';
        });
        window.removeSyrupItem = function(index) { syrupRecipe.splice(index, 1); saveState(); renderSyrupList(); calculateMaster(); };

        // MÓDULO 3: ADICIONAR EMBALAGEM
        document.getElementById('form-recipe-pack').addEventListener('submit', function(e) {
            e.preventDefault();
            const packId = selectRecipePackaging.value;
            const qtd = parseInt(document.getElementById('recipe-pack-qtd').value);
            if(!packId) return;
            const targetPack = packagings.find(p => p.id === packId);
            const existing = recipePacks.find(item => item.pack.id === packId);
            if(existing) existing.qtd += qtd; else recipePacks.push({ pack: targetPack, qtd });
            saveState(); renderRecipePacksList(); calculateMaster(); document.getElementById('recipe-pack-qtd').value = '';
        });
        window.removeRecipePack = function(index) { recipePacks.splice(index, 1); saveState(); renderRecipePacksList(); calculateMaster(); };

        // LIMPAR TUDO
        window.clearRecipe = function() {
            recipe = []; syrupRecipe = []; recipePacks = [];
            inputRecipeName.value = "Nova Receita"; 
            inputYield.value = 1; inputYieldUnit.value = "unid.";
            inputTime.value = "1h";
            inputSyrupBatchYield.value = 1; inputSyrupUsedVolume.value = 1;
            inputPackaging.value = "0.00"; 
            inputInvisible.value = 15; 
            inputLaborTime.value = 1; 
            if (inputCardFeeRate) inputCardFeeRate.value = 0;
            inputCmv.value = 35;
            saveState(); renderRecipeList(); renderSyrupList(); renderRecipePacksList(); calculateMaster();
        };
        document.getElementById('btn-clear-calculator').addEventListener('click', window.clearRecipe);

        // FAVORITOS
        window.saveCurrentToFavorites = function() {
            if(recipe.length === 0 && syrupRecipe.length === 0) return alert("Sua receita está vazia!");
            const recipeName = inputRecipeName.value.trim();
            if(recipeName === "" || recipeName === "Nova Receita") return alert("Dê um nome para a receita no topo.");
            const newFavorite = {
                id: Date.now().toString(), 
                name: recipeName, 
                recipeData: JSON.parse(JSON.stringify(recipe)), 
                syrupData: JSON.parse(JSON.stringify(syrupRecipe)), 
                recipePacksData: JSON.parse(JSON.stringify(recipePacks)), 
                yieldVal: parseFloat(inputYield.value), 
                yieldUnit: inputYieldUnit.value,
                timeVal: inputTime.value, 
                syrupBatchYield: parseFloat(inputSyrupBatchYield.value) || 1,
                syrupUsedVolume: parseFloat(inputSyrupUsedVolume.value) || 0,
                packaging: parseFloat(inputPackaging.value),
                invisibleRate: parseFloat(inputInvisible.value), 
                laborRate: parseFloat(inputLaborRate.value),
                laborTime: parseFloat(inputLaborTime.value), 
                cardFeeRate: parseFloat(inputCardFeeRate?.value || 0),
                cmv: parseFloat(inputCmv.value)
            };
            const existingIndex = favoriteRecipes.findIndex(f => f.name.toLowerCase() === recipeName.toLowerCase());
            if(existingIndex >= 0) { if(confirm("Substituir receita existente?")) favoriteRecipes[existingIndex] = newFavorite; else return; } 
            else favoriteRecipes.push(newFavorite);
            saveState(); renderFavorites(); alert("✅ Receita salva nos favoritos!");
        };

        window.loadFavorite = function(id) {
            const fav = favoriteRecipes.find(f => f.id === id); if(!fav) return;
            syncUpdatedLibrariesAcrossRecipes();
            inputRecipeName.value = fav.name; 
            recipe = JSON.parse(JSON.stringify(fav.recipeData));
            syrupRecipe = fav.syrupData ? JSON.parse(JSON.stringify(fav.syrupData)) : []; 
            recipePacks = fav.recipePacksData ? JSON.parse(JSON.stringify(fav.recipePacksData)) : []; 
            
            inputYield.value = fav.yieldVal; 
            inputYieldUnit.value = fav.yieldUnit || "unid.";
            inputTime.value = fav.timeVal || "1h"; 
            
            inputSyrupBatchYield.value = fav.syrupBatchYield || 1;
            inputSyrupUsedVolume.value = fav.syrupUsedVolume !== undefined ? fav.syrupUsedVolume : 1;

            inputPackaging.value = fav.packaging || "0.00"; 
            inputInvisible.value = fav.invisibleRate; 
            inputLaborRate.value = fav.laborRate || 15; 
            inputLaborTime.value = fav.laborTime || 1;
            if (inputCardFeeRate) inputCardFeeRate.value = fav.cardFeeRate || 0;
            inputCmv.value = fav.cmv || 35;
            
            saveState(); switchTab('precificador'); 
            renderRecipeList(); renderSyrupList(); renderRecipePacksList(); calculateMaster();
        };

        window.deleteFavorite = function(id) {
            if(confirm("Excluir favorito?")) { favoriteRecipes = favoriteRecipes.filter(f => f.id !== id); saveState(); renderFavorites(); }
        };

        // Calcula o resumo atualizado de qualquer receita favorita
        function computeFavoriteMetrics(fav) {
            const rBase = (fav.recipeData || []).reduce((acc, item) => acc + ((item.ingredient?.costPerGram || 0) * item.qtd), 0);
            const sBase = (fav.syrupData || []).reduce((acc, item) => acc + ((item.ingredient?.costPerGram || 0) * item.qtd), 0);
            const sYield = fav.syrupBatchYield || 1;
            const sUsed = fav.syrupUsedVolume !== undefined ? fav.syrupUsedVolume : 0;
            const sFinal = (sBase / sYield) * sUsed;
            const pTotal = (fav.recipePacksData || []).reduce((acc, item) => acc + ((item.pack?.costPerUnit || 0) * item.qtd), 0) + (fav.packaging || 0);
            const invCost = (rBase + sFinal) * ((fav.invisibleRate || 0) / 100);
            const prodCost = rBase + sFinal + pTotal + invCost;
            const lCost = (fav.laborRate || 0) * (fav.laborTime || 0);
            const tCost = prodCost + lCost;
            const cmvT = fav.cmv || 35;
            const tSale = (prodCost / (cmvT / 100)) + lCost;
            const yVal = fav.yieldVal || 1;
            return {
                unitCost: tCost / yVal,
                unitSale: tSale / yVal
            };
        }

        // RENDERIZAÇÕES GERAIS
        function renderAll() {
            syncUpdatedLibrariesAcrossRecipes();
            selectRecipeIngredient.innerHTML = '<option value="">Selecione na biblioteca...</option>';
            selectSyrupIngredient.innerHTML = '<option value="">Selecione na biblioteca...</option>';
            ingredients.forEach(i => {
                selectRecipeIngredient.innerHTML += `<option value="${i.id}">${i.name}</option>`;
                selectSyrupIngredient.innerHTML += `<option value="${i.id}">${i.name}</option>`;
            });
            
            selectRecipePackaging.innerHTML = '<option value="">Selecione...</option>';
            packagings.forEach(p => selectRecipePackaging.innerHTML += `<option value="${p.id}">${p.name}</option>`);

            ingredientsGridContainer.innerHTML = '';
            ingredients.forEach(i => {
                const per100g = (i.costPerGram || 0) * 100;
                ingredientsGridContainer.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-50">
                        <td class="px-6 py-3 font-medium text-gray-900">${i.name}</td>
                        <td class="px-6 py-3 text-gray-500 text-center">${i.size}g/ml <br><span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded font-semibold text-gray-700">${formatBRL(i.price)}</span></td>
                        <td class="px-6 py-3 text-center">
                            <span class="font-mono text-primary font-bold block">${formatPreciseUnitCost(i.costPerGram)} / g</span>
                            <span class="text-[10px] text-gray-400">(${formatBRL(per100g)} cada 100g)</span>
                        </td>
                        <td class="px-6 py-3 text-center space-x-1">
                            <button onclick="editIngredient('${i.id}')" class="text-sky-600 hover:text-sky-800 bg-sky-50 border border-sky-200 px-2.5 py-1 rounded text-xs font-bold">✏️ Editar</button>
                            <button onclick="deleteIngredient('${i.id}')" class="text-gray-400 hover:text-red-600 bg-white border border-gray-200 px-2.5 py-1 rounded text-xs">Excluir</button>
                        </td>
                    </tr>`;
            });
            kpiTotalIngredients.textContent = ingredients.length;

            packagingsGridContainer.innerHTML = '';
            packagings.forEach(p => {
                packagingsGridContainer.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b border-gray-50">
                        <td class="px-6 py-3 font-medium text-gray-900">${p.name}</td>
                        <td class="px-6 py-3 text-gray-500 text-center">${p.size} un. <br><span class="text-[10px] bg-gray-100 px-1.5 py-0.5 rounded font-semibold text-gray-700">${formatBRL(p.price)}</span></td>
                        <td class="px-6 py-3 text-center font-mono text-primary font-semibold">${formatBRL(p.costPerUnit)} / un.</td>
                        <td class="px-6 py-3 text-center space-x-1">
                            <button onclick="editPackaging('${p.id}')" class="text-sky-600 hover:text-sky-800 bg-sky-50 border border-sky-200 px-2.5 py-1 rounded text-xs font-bold">✏️ Editar</button>
                            <button onclick="deletePackaging('${p.id}')" class="text-gray-400 hover:text-red-600 bg-white border border-gray-200 px-2.5 py-1 rounded text-xs">Excluir</button>
                        </td>
                    </tr>`;
            });
            kpiTotalPackagings.textContent = packagings.length;

            renderRecipeList(); renderSyrupList(); renderRecipePacksList(); renderFavorites(); calculateMaster();
        }

        function renderRecipeList() {
            recipeItemsContainer.innerHTML = recipe.length === 0 ? '<div class="text-[10px] text-gray-400 text-center py-2">Nenhuma massa adicionada.</div>' : '';
            recipe.forEach((item, index) => {
                const subTotal = (item.ingredient.costPerGram || 0) * item.qtd;
                recipeItemsContainer.innerHTML += `
                    <div class="flex items-center px-2 py-1.5 hover:bg-gray-50 rounded-lg group border border-transparent hover:border-gray-100">
                        <div class="w-1/2"><p class="text-[11px] font-semibold text-gray-800 truncate pr-2">${item.ingredient.name}</p></div>
                        <div class="w-1/4 text-center text-[11px] text-gray-500 font-mono">${item.qtd}g/ml</div>
                        <div class="w-1/4 text-right flex items-center justify-end gap-2"><span class="text-[11px] font-bold text-gray-800">${formatBRL(subTotal)}</span><button onclick="removeRecipeItem(${index})" class="text-gray-300 hover:text-red-500 text-[10px] no-print">X</button></div>
                    </div>`;
            });
        }

        function renderSyrupList() {
            syrupItemsContainer.innerHTML = syrupRecipe.length === 0 ? '<div class="text-[10px] text-purple-300 text-center py-2">Nenhuma calda adicionada.</div>' : '';
            syrupRecipe.forEach((item, index) => {
                const subTotal = (item.ingredient.costPerGram || 0) * item.qtd;
                syrupItemsContainer.innerHTML += `
                    <div class="flex items-center px-2 py-1.5 hover:bg-purple-50 rounded-lg group border border-transparent hover:border-purple-100">
                        <div class="w-1/2"><p class="text-[11px] font-semibold text-purple-900 truncate pr-2">${item.ingredient.name}</p></div>
                        <div class="w-1/4 text-center text-[11px] text-purple-600 font-mono">${item.qtd}g/ml</div>
                        <div class="w-1/4 text-right flex items-center justify-end gap-2"><span class="text-[11px] font-bold text-purple-900">${formatBRL(subTotal)}</span><button onclick="removeSyrupItem(${index})" class="text-purple-300 hover:text-red-500 text-[10px] no-print">X</button></div>
                    </div>`;
            });
        }

        function renderRecipePacksList() {
            recipePacksContainer.innerHTML = recipePacks.length === 0 ? '<div class="text-[10px] text-gray-400 py-1">Nenhuma embalagem adicionada.</div>' : '';
            recipePacks.forEach((item, index) => {
                const subTotal = (item.pack.costPerUnit || 0) * item.qtd;
                recipePacksContainer.innerHTML += `
                    <div class="flex items-center justify-between py-1 border-b border-gray-50 last:border-0">
                        <span class="text-gray-700 truncate pr-2 w-1/2">${item.pack.name}</span>
                        <span class="text-gray-500 w-1/6 text-center">${item.qtd} un</span>
                        <div class="flex items-center justify-end gap-2 w-1/3">
                            <span class="font-bold text-gray-800">${formatBRL(subTotal)}</span>
                            <button onclick="removeRecipePack(${index})" class="text-gray-300 hover:text-red-500 no-print">X</button>
                        </div>
                    </div>`;
            });
        }

        function renderFavorites() {
            favoritesGridContainer.innerHTML = favoriteRecipes.length === 0 ? '<div class="col-span-full text-center py-10 text-gray-400">Nenhuma receita salva ainda.</div>' : '';
            favoriteRecipes.forEach(fav => {
                const favUnit = fav.yieldUnit || "unid.";
                const metrics = computeFavoriteMetrics(fav);
                favoritesGridContainer.innerHTML += `
                    <div class="bg-white border border-gray-200 p-5 rounded-2xl relative group shadow-sm space-y-3">
                        <button onclick="deleteFavorite('${fav.id}')" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 font-bold">X</button>
                        <div>
                            <h3 class="font-bold text-gray-900">${fav.name}</h3>
                            <p class="text-xs text-gray-500 mt-0.5">Rende ${fav.yieldVal} ${favUnit} • CMV: ${fav.cmv}%</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                            <div>
                                <span class="text-[10px] text-gray-400 block">Custo Atual / ${favUnit}</span>
                                <span class="font-bold text-gray-800">${formatBRL(metrics.unitCost)}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-400 block">Venda PIX / ${favUnit}</span>
                                <span class="font-extrabold text-greenSuccess">${formatBRL(metrics.unitSale)}</span>
                            </div>
                        </div>
                        <button onclick="loadFavorite('${fav.id}')" class="w-full py-2 bg-primary/10 text-primary rounded-xl text-sm font-bold hover:bg-primary hover:text-white transition-colors">Carregar Receita</button>
                    </div>`;
            });
        }

        // CÁLCULO MESTRE INTELIGENTE v2.0 (SEM SUPERESTIMATIVA DE MÃO DE OBRA)
        function calculateMaster() {
            // Módulo 1 (Massa)
            const recipeBaseCost = recipe.reduce((acc, item) => acc + ((item.ingredient.costPerGram || 0) * item.qtd), 0);
            
            // Módulo 2 (Calda - Fracionamento)
            const syrupBaseCost = syrupRecipe.reduce((acc, item) => acc + ((item.ingredient.costPerGram || 0) * item.qtd), 0);
            const syrupYield = parseFloat(inputSyrupBatchYield.value) || 1;
            const syrupUsed = parseFloat(inputSyrupUsedVolume.value) || 0;
            const syrupCostPerMl = syrupBaseCost / syrupYield;
            const syrupFinalCost = syrupCostPerMl * syrupUsed;
            
            // Módulo 3 (Embalagens)
            const dynamicPackagingCost = recipePacks.reduce((acc, item) => acc + ((item.pack.costPerUnit || 0) * item.qtd), 0);
            const legacyPackagingCost = parseFloat(inputPackaging.value) || 0;
            const packagingTotal = dynamicPackagingCost + legacyPackagingCost;
            
            const yieldVal = parseFloat(inputYield.value) || 1; 
            const unitLabel = inputYieldUnit.value;
            const invisibleRate = parseFloat(inputInvisible.value) || 0; 
            const laborRate = parseFloat(inputLaborRate.value) || 0;
            const laborTime = parseFloat(inputLaborTime.value) || 0; 
            const cardFeeRate = parseFloat(inputCardFeeRate?.value) || 0;
            const cmvTarget = Math.max(1, Math.min(100, parseFloat(inputCmv.value) || 35));

            // Custos Variáveis (Gás, Energia, Detergente, Perda Técnica) sobre Massa + Calda usada
            const variablesCost = (recipeBaseCost + syrupFinalCost) * (invisibleRate / 100);

            // Custo de Produção (Insumos + Embalagens + Variáveis)
            const productionCost = recipeBaseCost + syrupFinalCost + packagingTotal + variablesCost;

            // Mão de Obra Direta (Salário da Confeiteira naquela receita)
            const laborCostTotal = laborRate * laborTime;
            
            // Custo Total Real da Receita (Insumos + Mão de Obra)
            const totalCostReceita = productionCost + laborCostTotal;
            
            // Fórmula Inteligente v2.0:
            // O divisor de CMV incide sobre o Custo de Produção (Insumos + Embalagens + Gás/Luz)
            // e a Mão de Obra Direta é somada integralmente sem ser multiplicada por 2,85x!
            const totalSalePrice = productionCost > 0
                ? (productionCost / (cmvTarget / 100)) + laborCostTotal
                : laborCostTotal;

            // Lucro Líquido da Doceria (além da mão de obra já paga!)
            const totalProfit = Math.max(0, totalSalePrice - totalCostReceita);

            // Ganho Total no Bolso da Confeiteira (Salário da Mão de Obra + Lucro Líquido da Doceria)
            const totalPocketEarning = laborCostTotal + totalProfit;

            // Preço com Taxa de Cartão / App (divisor por dentro: PreçoPIX / (1 - taxa/100))
            const safeFeeFactor = Math.max(0.1, 1 - (cardFeeRate / 100));
            const totalCardSalePrice = totalSalePrice / safeFeeFactor;

            // Updates Visuais
            lblSubtotalIng.textContent = formatBRL(recipeBaseCost); 
            lblSubtotalSyrup.textContent = formatBRL(syrupBaseCost); 
            lblSyrupCostPerMl.textContent = formatPreciseUnitCost(syrupCostPerMl);
            lblSyrupFinalCost.textContent = formatBRL(syrupFinalCost);

            lblTotalPackaging.textContent = formatBRL(packagingTotal);
            lblVarCost.textContent = formatBRL(variablesCost); 
            lblLaborCost.textContent = formatBRL(laborCostTotal);
            
            resTotalCost.textContent = formatBRL(totalCostReceita); 
            resUnitCost.textContent = `${formatBRL(totalCostReceita / yieldVal)} por ${unitLabel}`;
            if (resCostBreakdown) {
                resCostBreakdown.textContent = `Insumos/Emb: ${formatBRL(productionCost)} + Mão de Obra: ${formatBRL(laborCostTotal)}`;
            }

            resUnitSalePrice.textContent = formatBRL(totalSalePrice / yieldVal); 
            resTotalRevenue.textContent = `Venda Total PIX: ${formatBRL(totalSalePrice)}`;

            if (resCardSalePrice) {
                if (cardFeeRate > 0) {
                    resCardSalePrice.textContent = `💳 Cartão/App (+${cardFeeRate}%): ${formatBRL(totalCardSalePrice / yieldVal)} / ${unitLabel}`;
                    resCardSalePrice.classList.remove('hidden');
                } else {
                    resCardSalePrice.classList.add('hidden');
                }
            }

            if (resLaborEarning) resLaborEarning.textContent = formatBRL(laborCostTotal);
            if (resLaborUnit) resLaborUnit.textContent = `(${formatBRL(laborCostTotal / yieldVal)} por ${unitLabel})`;

            resTotalProfit.textContent = formatBRL(totalProfit); 
            resUnitProfit.textContent = `(${formatBRL(totalProfit / yieldVal)} por ${unitLabel})`;

            if (resPocketTotal) resPocketTotal.textContent = formatBRL(totalPocketEarning);
            if (resPocketUnit) resPocketUnit.textContent = `(${formatBRL(totalPocketEarning / yieldVal)} limpos por ${unitLabel})`;
        }

        function saveState() {
            localStorage.setItem('cianela_db_ingredients', JSON.stringify(ingredients));
            localStorage.setItem('cianela_db_packagings_lib', JSON.stringify(packagings));
            localStorage.setItem('cianela_db_current_recipe', JSON.stringify(recipe));
            localStorage.setItem('cianela_db_current_syrup', JSON.stringify(syrupRecipe));
            localStorage.setItem('cianela_db_current_recipe_packs', JSON.stringify(recipePacks));
            localStorage.setItem('cianela_db_favorites', JSON.stringify(favoriteRecipes));
            
            localStorage.setItem('cianela_db_current_name', inputRecipeName.value);
            localStorage.setItem('cianela_db_yield', inputYield.value); 
            localStorage.setItem('cianela_db_yieldUnit', inputYieldUnit.value);
            localStorage.setItem('cianela_db_time', inputTime.value);
            
            localStorage.setItem('cianela_db_syrup_yield', inputSyrupBatchYield.value);
            localStorage.setItem('cianela_db_syrup_used', inputSyrupUsedVolume.value);

            localStorage.setItem('cianela_db_packaging', inputPackaging.value); 
            localStorage.setItem('cianela_db_invisible', inputInvisible.value);
            localStorage.setItem('cianela_db_laborRate', inputLaborRate.value); 
            localStorage.setItem('cianela_db_laborTime', inputLaborTime.value);
            if (inputCardFeeRate) localStorage.setItem('cianela_db_cardFee', inputCardFeeRate.value);
            localStorage.setItem('cianela_db_cmv', inputCmv.value);
        }

        [inputRecipeName, inputYield, inputYieldUnit, inputTime, inputSyrupBatchYield, inputSyrupUsedVolume, inputPackaging, inputInvisible, inputLaborRate, inputLaborTime, inputCardFeeRate, inputCmv].forEach(inp => {
            if(inp) inp.addEventListener('input', () => { calculateMaster(); saveState(); });
        });

        renderAll();
    </script>
</body>
